# Render 배포 정의(Blueprint).
#
# 대시보드에서 직접 설정해도 되지만 파일로 두는 이유는, 인스턴스를 다시 만들
# 일이 생겼을 때 무엇을 어떻게 설정했는지가 남아 있어야 하기 때문이다.
# 값이 비밀인 항목은 sync: false 로 두고 대시보드에서 입력한다.
#
# 대시보드에서만 되는 설정과 확인 절차는 docs/deployment.md 참조.

services:
  - type: web
    name: nokknok-api
    runtime: python
    plan: free
    # DB가 Neon ap-southeast-1(싱가포르)에 있다. 리전을 맞추지 않으면
    # 쿼리마다 대륙을 왕복해 응답 시간이 눈에 띄게 늘어난다.
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render 는 $PORT 를 주입한다. 8000 으로 고정하면 인스턴스가 뜨지 않는다.
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    # DB를 조회하지 않는 경로다. 무료 티어 커넥션 한도를 헬스체크가 잠식하지 않는다.
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: gemini
      # 무료 티어는 동시 연결 한도가 낮다. 배치 스크립트와 나눠 쓰므로 작게 잡는다.
      - key: DB_POOL_MAX
        value: 5
      - key: DB_POOL_TIMEOUT_S
        value: 10
      - key: LLM_BATCH_TIMEOUT_MS
        value: 15000
      - key: LLM_BATCH_MAX_RETRY
        value: 5
      - key: LLM_RUNTIME_TIMEOUT_BUDGET_MS
        value: 3500
      # ─── 비밀값. 대시보드에서 입력한다 ───
      # DATABASE_URL 은 반드시 풀링(-pooler) 주소여야 한다.
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      # 프론트는 Vercel rewrite 로 같은 오리진에서 호출하므로 브라우저 CORS 가
      # 걸리지 않는다. 그래도 직접 호출 경로를 열어둘 수 있게 값을 받아둔다.
      - key: CORS_ORIGIN
        sync: false
