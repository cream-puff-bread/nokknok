openapi: 3.0.3
info:
  title: 넉넉(nokknok) API
  version: 0.1.0
  description: |
    가용잔고 산출, 현금흐름 시뮬레이션, 결제 라우팅 최적화 API.

    설계 원칙
    - 모든 금액은 원 단위 정수이며, 금액 계산은 서버가 전담한다.
    - LLM은 질의 해석과 결과 설명에만 관여하며 금액을 계산하지 않는다.
    - LLM 생성 실패 시에도 계산 결과는 반드시 응답에 포함된다.

servers:
  - url: https://nokknok-api.onrender.com
    description: 배포 환경
  - url: http://localhost:8000
    description: 로컬

paths:
  /api/health:
    get:
      summary: 헬스체크 (keep-alive용)
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  time:   { type: string, format: date-time }

  /api/personas:
    get:
      summary: 시연용 페르소나 목록
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Persona' }
        '500':
          $ref: '#/components/responses/InternalError'

  /api/balance:
    get:
      summary: 가용잔고 조회
      parameters:
        - name: personaId
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceResponse' }
        '404':
          description: 페르소나 없음 (PERSONA_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: 요청 형식 오류 (INVALID_REQUEST)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'

  /api/simulate:
    post:
      summary: 6개월 현금흐름 시뮬레이션
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personaId, query]
              properties:
                personaId: { type: integer }
                query:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: |
                    자연어 질의. 화면 입력란도 같은 길이로 제한한다 —
                    긴 문장은 LLM 런타임 예산을 넘기기 쉽고 비용도 는다.
                  example: 아이폰 180만원 할부로 사도 될까
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResponse' }
        '404':
          description: 페르소나 없음 (PERSONA_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            질의에서 금액을 추출하지 못했거나(QUERY_PARSE_FAILED)
            요청 형식이 잘못된 경우(INVALID_REQUEST).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'

  /api/route:
    post:
      summary: 결제 라우팅 최적화
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personaId, amount]
              properties:
                personaId: { type: integer }
                amount:    { type: integer, example: 1800000 }
                category:  { type: string,  example: ONLINE }
                dueDate:
                  type: string
                  format: date
                  description: 구매 기한. 생략 시 오늘부터 30일
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteResponse' }
        '404':
          description: 페르소나 없음 (PERSONA_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            요청 값이 규칙 판정에 쓸 수 없는 경우.
            category 가 spend_category 마스터에 없는 코드이거나(INVALID_CATEGORY),
            amount 가 0 이하인 경우(INVALID_AMOUNT),
            요청 형식 자체가 잘못된 경우(INVALID_REQUEST)다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            검수를 통과한 규칙을 가진 카드가 하나도 없어 판정할 수 없음
            (NO_VERIFIED_RULE).

            요청은 올바르므로 422 와 구분한다. 422 는 입력을 고치면 해결되지만
            이 경우는 이용자가 무엇을 바꿔도 달라지지 않는다. 화면도 "입력을
            확인하세요"가 아니라 "지금은 판정할 수 없습니다"여야 한다.

            보유 카드로 실적 조건을 못 채우는 것은 이 경우가 아니다. 그때는
            정상 응답에 newCardSuggestion 을 채운다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'

components:
  responses:
    InternalError:
      description: 서버 내부 오류 (INTERNAL_ERROR)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      description: |
        모든 오류 응답은 이 형식을 따른다.
        FastAPI 기본 검증 오류 본문({ detail: [...] })을 그대로 내보내지 않는다.
      properties:
        code:
          type: string
          enum:
            - PERSONA_NOT_FOUND
            - QUERY_PARSE_FAILED
            - INVALID_CATEGORY
            - INVALID_AMOUNT
            # 요청 형식 자체가 잘못된 경우(타입 불일치, 필수 값 누락 등).
            # FastAPI 가 자동으로 만들어내는 검증 실패를 이 코드로 통일한다.
            - INVALID_REQUEST
            # 검수를 통과한 규칙을 가진 카드가 하나도 없어 판정 자체가 불가능한 경우.
            # 일부 카드만 제외된 경우는 오류가 아니라 정상 응답이며
            # computeMeta.excludedUnverifiedCards 로 알린다.
            - NO_VERIFIED_RULE
            # 처리되지 않은 서버 오류. 예외 원문은 절대 message 에 싣지 않는다.
            - INTERNAL_ERROR
          example: QUERY_PARSE_FAILED
        message:
          type: string
          description: 사용자에게 보여줄 안내 문구. 예외 원문을 그대로 싣지 않는다

    Persona:
      type: object
      properties:
        id:             { type: integer }
        code:           { type: string, example: SUBSCRIPTION_HEAVY }
        displayName:    { type: string, example: 구독이 많은 김넉넉 }
        description:    { type: string }
        accountBalance: { type: integer }
        cardCount:      { type: integer }

    FixedExpense:
      type: object
      properties:
        label:         { type: string }
        amount:        { type: integer }
        chargeDay:     { type: integer }
        expenseType:   { type: string, enum: [SUBSCRIPTION, INSTALLMENT, LOAN, INSURANCE] }
        unusedSuspect: { type: boolean, description: 미사용 의심 구독 }

    BalanceResponse:
      type: object
      properties:
        accountBalance:   { type: integer, description: 통장 표시 잔액 }
        fixedTotal:       { type: integer, description: 확정 지출 합계 }
        availableBalance: { type: integer, description: 가용잔고 }
        fixedExpenses:
          type: array
          items: { $ref: '#/components/schemas/FixedExpense' }

    ParsedQuery:
      type: object
      properties:
        amount:            { type: integer }
        paymentType:       { type: string, enum: [LUMP, INSTALLMENT, INTEREST_FREE] }
        installmentMonths: { type: integer }
        category:          { type: string }

    ScenarioPoint:
      type: object
      properties:
        month:   { type: string, example: 2026-09 }
        balance: { type: integer }

    Scenario:
      type: object
      properties:
        level: { type: string, enum: [COMFORTABLE, NORMAL, TIGHT] }
        points:
          type: array
          items: { $ref: '#/components/schemas/ScenarioPoint' }

    SimulationResponse:
      type: object
      properties:
        parsed: { $ref: '#/components/schemas/ParsedQuery' }
        scenarios:
          type: array
          description: 여유 / 보통 / 빠듯 3종
          items: { $ref: '#/components/schemas/Scenario' }
        deadPoint:
          type: object
          nullable: true
          description: 잔고가 음수로 전환되는 시점. 없으면 null
          properties:
            month:    { type: string, example: 2026-11 }
            level:
              type: string
              enum: [COMFORTABLE, NORMAL, TIGHT]
              description: 적자로 먼저 전환되는 시나리오. types.ts 의 ScenarioLevel 과 같은 값 집합이다
            shortage: { type: integer }
        forecastMeta:
          type: object
          description: 예측 신뢰도 판단 근거를 이용자에게 노출하기 위한 정보
          properties:
            monthsUsed: { type: integer }
            txnCount:   { type: integer }
            coldStart:  { type: boolean }

    ClauseRef:
      type: object
      properties:
        content: { type: string }
        docName: { type: string }
        pageNo:  { type: integer }

    RouteCandidate:
      type: object
      description: |
        최적화 엔진(seohee-P)이 반환하는 순수 계산 결과.
        LLM·RAG와 무관하며 엔진 단위 테스트는 이 스키마만으로 검증 가능하다.
      properties:
        cardId:            { type: integer }
        cardName:          { type: string }
        payDate:           { type: string, format: date }
        paymentType:       { type: string, enum: [LUMP, INSTALLMENT, INTEREST_FREE] }
        installmentMonths: { type: integer }
        expectedDiscount:  { type: integer }
        perfAchieved:      { type: boolean }
        perfCurrent:       { type: integer }
        perfRequired:      { type: integer }
        ruleId:
          type: integer
          description: |
            이 결과를 산출할 때 적용한 card_benefit_rule.id.
            fanfanduck이 clause_id 조인으로 근거 조항을 정확히 특정하는 데 사용한다.
            이 경로에서는 벡터 검색을 사용하지 않는다.

    RouteOption:
      description: |
        API 응답 타입. fanfanduck이 RouteCandidate에 근거 조항과 LLM 설명을 덧붙여 조립한다.
      allOf:
        - $ref: '#/components/schemas/RouteCandidate'
        - type: object
          properties:
            explanation:
              type: string
              nullable: true
              description: |
                LLM 생성 설명. 생성 실패 또는 타임아웃 시 null이며,
                이 경우에도 나머지 계산 값은 정상 표시해야 한다.
            clauses:
              type: array
              description: ruleId 조인으로 조회한 근거 조항. 조회 실패 시 빈 배열
              items: { $ref: '#/components/schemas/ClauseRef' }

    RouteResponse:
      type: object
      properties:
        best:
          allOf:
            - $ref: '#/components/schemas/RouteOption'
          description: 설명 생성은 best에만 적용한다
        alternatives:
          type: array
          description: |
            대안은 계산 결과만 제시한다.
            RouteOption으로 두면 항상 null인 explanation 필드가 생겨 혼란을 유발하므로
            RouteCandidate를 사용한다.
          items: { $ref: '#/components/schemas/RouteCandidate' }
        newCardSuggestion:
          type: object
          nullable: true
          description: |
            보유 카드로 조건 충족 불가 시에만 존재.
            최적화 결과와 시각적으로 분리해 표시하고 제휴 여부를 함께 밝힌다.
          properties:
            cardName:     { type: string }
            expectedGain: { type: integer }
            isAffiliate:  { type: boolean }
        computeMeta:
          type: object
          description: 가지치기 효과를 화면에 보여주기 위한 정보
          properties:
            candidatesTotal:  { type: integer }
            candidatesPruned: { type: integer }
            elapsedMs:        { type: integer }
            excludedUnverifiedCards:
              type: integer
              description: |
                verified=false 규칙만 있어 후보에서 제외한 카드 수.
                검수를 통과하지 않은 규칙은 판정에 쓰지 않으므로 오류가 아니라
                정상 응답으로 처리하고, 제외했다는 사실만 노출한다.
                다른 필드가 조합 단위 숫자인 것과 달리 이 값은 카드 단위다.
