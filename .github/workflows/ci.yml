name: ci

# PR 마다 같은 명령을 같은 환경에서 돌려 결과를 하나로 고정한다.
#
# 최근 며칠 동안 테스트 개수가 세 번 어긋났고 전부 환경 차이였다 —
# 리베이스한 로컬 vs 푸시된 구버전, .env 의 LLM 키 유무, DATABASE_URL 유무.
# 매번 사람이 손으로 재현해 원인을 찾았다. CI 가 그 숫자를 고정하면
# PR 본문과 리뷰어의 수치가 다툴 일이 없어진다.

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR 에 새 커밋이 오면 이전 실행은 의미가 없다. 무료 러너 시간을 아낀다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # 통합 테스트는 실제 DB에 붙는다. conftest 가 트랜잭션을 열고 무조건
      # 롤백하므로 시드 데이터는 건드리지 않는다.
      #
      # 시크릿이 없으면 통합 테스트만 자동으로 skip 되고 exit code 는 0 이라
      # CI 가 초록불로 뜬다. 편의를 위한 동작이지만 그대로 두면 "통합 테스트가
      # 돌고 있다"고 착각하게 된다 — keep-alive 의 `|| echo` 나 CONTRIBUTING.md
      # 의 대조 기준처럼, 사람이 챙겨야만 지켜지는 규칙은 결국 안 지켜진다.
      # 그래서 두 경우를 워크플로가 직접 구분한다.
      - name: pytest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL 시크릿이 없어 통합 테스트가 skip됩니다. 단위 테스트만 검증됩니다."
            {
              echo "### ⚠️ 통합 테스트 skip"
              echo ""
              echo "\`DATABASE_URL\` 시크릿이 등록되지 않아 단위 테스트만 실행했습니다."
              echo "통합 테스트를 켜려면 저장소 시크릿에 \`nokknok_ci\` 롤 접속 문자열을 넣으세요."
            } >> "$GITHUB_STEP_SUMMARY"
            pytest -q
            exit $?
          fi

          # 시크릿이 있으면 통합 테스트가 반드시 실제로 돌아야 한다.
          # skip 이 하나라도 있으면 DB 연결이 실패해 조용히 건너뛴 것이므로 실패시킨다.
          set -o pipefail
          pytest -q | tee pytest-output.txt
          if grep -qE '[0-9]+ skipped' pytest-output.txt; then
            echo "::error::DATABASE_URL 이 설정됐는데 skip 된 테스트가 있습니다. DB 연결에 실패했거나 권한이 부족합니다."
            grep -E 'passed|skipped|failed' pytest-output.txt >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc 를 단일 출처로 삼는다. 여기 버전을 다시 적으면
          # 로컬과 CI 가 조용히 갈라진다.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci 는 lockfile 을 그대로 설치한다. engine-strict=true 라
      # Node 버전이 맞지 않으면 여기서 바로 실패한다.
      - run: npm ci

      # typecheck 와 build 는 각각 pre 훅에서 contracts/types.ts 를
      # 복사한다. 계약이 바뀌면 사본도 함께 갱신된 상태로 검사된다.
      - run: npm run typecheck
      - run: npm run build
